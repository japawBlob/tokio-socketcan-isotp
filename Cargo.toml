[package]
name = "tokio-socketcan-isotp"
version = "0.4.0"
edition = "2021"
authors = ["Jakub Jíra <jakub.jira@protonmail.com>"]
license = "MIT"
description = "A asynchronous tokio ISO-TP library build on top of socketcan-isotp."
homepage = "https://github.com/japawBlob/tokio-socketcan-isotp"
repository = "https://github.com/japawBlob/tokio-socketcan-isotp"
readme = "README.md"
keywords = ["async","socketcan", "iso-tp", "isotp", "iso-15762-2"]
categories = ["network-programming", "os::linux-apis", "asynchronous"]

[badges]
maintenance = { status = "actively-developed"}

[features]
default = []
# Userspace ISO 15765-2 implementation (segmentation + flow control) running
# over raw CAN frames. Enables the `rawcan:<ifname>` address scheme on Linux,
# which only needs CAN_RAW sockets (vcan suffices, no can_isotp module).
isotp-userspace = []
# Carry raw CAN frames over TCP instead of a CAN bus. Enables the
# `tcp:<host>:<port>` and `tcplisten:<addr>:<port>` address schemes on all
# platforms. The userspace ISO-TP implementation always runs on top.
tcp = ["isotp-userspace"]
# Carry raw CAN frames over a socketcand daemon (rawmode). Enables the
# `socketcand:<host>:<port>:<bus>` address scheme on all platforms. The
# userspace ISO-TP implementation always runs on top.
socketcand = ["isotp-userspace"]

[dependencies]
tokio = { version = "1", features = ["net", "sync", "time", "io-util", "rt"] }
bitflags = "2.4.1"
embedded-can = "0.4"
thiserror = "1.0"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
nix = "0.26"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
